heading:
  en: Let's build it.
  id: Mari kita bangun.
intro:
  en: Tell me what you need in two or three sentences. I reply within a day with next steps or an honest "not a fit".
  id: Ceritakan kebutuhan Anda dalam dua atau tiga kalimat. Saya balas dalam sehari dengan langkah berikutnya, atau jujur bilang kalau tidak cocok.
